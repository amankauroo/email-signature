<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Signature</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 24px;
      background-color: #f1f5f9;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        border-collapse: collapse;
        background-color: #ffffff;
        color: #0f172a;
      "
    >
      <tr>
        <!-- Portrait -->
        <td style="padding: 12px 18px; vertical-align: middle">
          <img
            src="assets/profile-portrait.jpg"
            alt="Portrait of Aman Kauroo"
            width="120"
            height="190"
            style="
              display: block;
              width: 120px;
              height: 190px;
              object-fit: cover;
              border: 0;
              border-radius: 5px;
            "
          />
        </td>

        <!-- Contact information -->
        <td
          style="
            padding: 18px 22px;
            vertical-align: middle;
            font-size: 13px;
            line-height: 19px;
            border-left: 1px solid #e2e8f0;
          "
        >
          <!-- Full name -->
          <div
            style="
              font-size: 18px;
              font-weight: bold;
              line-height: 23px;
              color: #0f172a;
            "
          >
            KAUROO Aman Nasrdeen Wazhir
          </div>

          <!-- Academic details -->
          <div style="padding-top: 4px; color: #475569">
            BSc (Hons) Computer Science Year 1<br />
            University of Mauritius
          </div>

          <!-- Professional interests -->
          <div
            style="
              padding-top: 8px;
              font-size: 12px;
              font-weight: bold;
              color: #1e3a8a;
            "
          >
            Web Development
            <span style="color: #94a3b8">&nbsp;|&nbsp;</span>
            Python
            <span style="color: #94a3b8">&nbsp;|&nbsp;</span>
            Robotics
          </div>

          <!-- Contact details -->
          <div style="padding-top: 8px; color: #334155">
            <a
              href="mailto:aman.kauroo@umail.uom.ac.mu"
              style="color: #334155; text-decoration: none"
            >
              Email: aman.kauroo@umail.uom.ac.mu
            </a>
            <br />

            <a
              href="tel:+23058582189"
              style="color: #334155; text-decoration: none"
            >
              Phone: +230 58582189
            </a>
          </div>

          <!-- Social media icons -->
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="border-collapse: collapse; margin-top: 12px"
          >
            <tr>
              <td style="padding-right: 10px">
                <a href="https://www.instagram.com/amankauroo">
                  <img
                    src="assets/instagram.png"
                    alt="Instagram"
                    width="22"
                    height="22"
                    style="display: block; border: 0"
                  />
                </a>
              </td>

              <td style="padding-right: 10px">
                <a href="https://www.linkedin.com/in/amankauroo">
                  <img
                    src="assets/linkedin.png"
                    alt="LinkedIn"
                    width="22"
                    height="22"
                    style="display: block; border: 0"
                  />
                </a>
              </td>

              <td style="padding-right: 10px">
                <a href="https://github.com/amankauroo">
                  <img
                    src="assets/github.png"
                    alt="GitHub"
                    width="22"
                    height="22"
                    style="display: block; border: 0"
                  />
                </a>
              </td>

              <td>
                <a href="https://amankauroo.vercel.app">
                  <img
                    src="assets/world-wide-web.png"
                    alt="Portfolio"
                    width="22"
                    height="22"
                    style="display: block; border: 0"
                  />
                </a>
              </td>
            </tr>
          </table>

          <!-- Calligraphic signature -->
        </td>
      </tr>
    </table>
  </body>
</html>
