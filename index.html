<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Signature</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="flex min-h-screen items-center justify-center bg-slate-100 p-4 font-sans"
  >
    <div
      class="flex w-full max-w-2xl items-stretch gap-4 rounded-xl bg-white p-4 text-slate-900 shadow-sm sm:gap-5"
    >
      <div class="w-24 h-100 overflow-hidden">
        <img
          src="assets/profile-portrait.jpg"
          alt="Portrait of Aman Kauroo"
          width="90"
          height="160"
          class="h-full w-full object-cover"
        />
      </div>

      <div class="min-w-0 flex-1">
        <div class="text-lg font-bold leading-tight">
          KAUROO Aman Nasrdeen Wazhir
        </div>
        <div class="mt-1 text-sm leading-5 text-slate-600">
          BSc (Hons) Computer Science Year 1
        </div>
        <div class="text-sm leading-5 text-slate-600">
          University of Mauritius
        </div>

        <div class="mt-2 text-sm font-medium text-blue-900">
          Web Development <span class="px-1 text-slate-400">|</span> Python
          <span class="px-1 text-slate-400">|</span> Robotics
        </div>

        <div class="mt-2 space-y-0.5 text-sm text-slate-700">
          <div>
            <a
              href="mailto:aman.kauroo@umail.uom.ac.mu"
              class="break-all hover:text-blue-900"
              >Email: aman.kauroo@umail.uom.ac.mu</a
            >
          </div>
          <div>
            <a href="tel:+23058582189" class="hover:text-blue-900"
              >Phone: +230 58582189</a
            >
          </div>
        </div>

        <div class="mt-3 flex items-center gap-2">
          <a
            href="https://www.instagram.com/amankauroo"
            aria-label="Instagram"
            class="rounded-full transition-opacity hover:opacity-75"
          >
            <img
              src="assets/instagram.png"
              alt=""
              width="24"
              height="24"
              class="h-6 w-6"
            />
          </a>
          <a
            href="https://www.linkedin.com/in/amankauroo"
            aria-label="LinkedIn"
            class="rounded-full transition-opacity hover:opacity-75"
          >
            <img
              src="assets/linkedin.png"
              alt=""
              width="24"
              height="24"
              class="h-6 w-6"
            />
          </a>
          <a
            href="https://github.com/amankauroo"
            aria-label="GitHub"
            class="rounded-full transition-opacity hover:opacity-75"
          >
            <img
              src="assets/github.png"
              alt=""
              width="24"
              height="24"
              class="h-6 w-6"
            />
          </a>
          <a
            href="https://amankauroo.vercel.app"
            aria-label="Portfolio"
            class="rounded-full transition-opacity hover:opacity-75"
          >
            <img
              src="assets/world-wide-web.png"
              alt=""
              width="24"
              height="24"
              class="h-6 w-6"
            />
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
